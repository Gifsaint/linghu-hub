<!DOCTYPE html>

  <meta name="description" content="令狐：在新加坡折腾 AI 与自动化的硬核中年。YouTube、小红书等平台入口。" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />

  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #0b1020;
      --card: #141b2f;
      --text: #eef2ff;
      --muted: #a7b0c9;
      --accent: #6ea8ff;
      --accent-2: #ff7a59;
      --border: rgba(255,255,255,0.08);
      --shadow: 0 20px 50px rgba(0,0,0,0.35);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Noto Sans SC", system-ui, -apple-system, sans-serif;
      color: var(--text);
      background:
        radial-gradient(900px 500px at 10% -10%, rgba(110,168,255,0.25), transparent 60%),
        radial-gradient(700px 400px at 100% 0%, rgba(255,122,89,0.18), transparent 55%),
        var(--bg);
      line-height: 1.65;
    }
    .wrap {
      width: min(720px, calc(100% - 2rem));
      margin: 0 auto;
      padding: 3.5rem 0 4rem;
    }
    .hero {
      background: linear-gradient(180deg, rgba(255,255,255,0.04), transparent);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 2rem 1.5rem 1.75rem;
      box-shadow: var(--shadow);
      backdrop-filter: blur(8px);
    }
    .avatar {
      width: 84px;
      height: 84px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      margin: 0 auto 1rem;
      font-weight: 700;
      font-size: 1.6rem;
      letter-spacing: 0.04em;
      color: white;
      background: linear-gradient(135deg, #6ea8ff, #ff7a59);
      box-shadow: 0 10px 30px rgba(110,168,255,0.35);
    }
    h1 {
      margin: 0;
      text-align: center;
      font-size: clamp(1.6rem, 4vw, 2rem);
      font-weight: 700;
      letter-spacing: 0.02em;
    }
    .tagline {
      margin: 0.55rem 0 0;
      text-align: center;
      color: var(--accent);
      font-weight: 500;
      font-size: 1rem;
    }
    .bio {
      margin: 1.35rem 0 0;
      color: var(--muted);
      font-size: 0.98rem;
    }
    .bio p { margin: 0 0 0.85rem; }
    .bio p:last-child { margin-bottom: 0; }
    h2 {
      margin: 2rem 0 0.85rem;
      font-size: 0.85rem;
      font-weight: 500;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--muted);
    }
    .links {
      display: grid;
      gap: 0.75rem;
    }
    a.link {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      padding: 1rem 1.1rem;
      border-radius: 16px;
      text-decoration: none;
      color: var(--text);
      background: var(--card);
      border: 1px solid var(--border);
      transition: transform .15s ease, border-color .15s ease, background .15s ease;
    }
    a.link:hover {
      transform: translateY(-2px);
      border-color: rgba(110,168,255,0.45);
      background: #18213a;
    }
    a.link .left {
      display: flex;
      align-items: center;
      gap: 0.85rem;
    }
    .badge {
      width: 42px;
      height: 42px;
      border-radius: 12px;
      display: grid;
      place-items: center;
      font-size: 0.78rem;
      font-weight: 700;
      background: rgba(255,255,255,0.06);
    }
    .meta { display: flex; flex-direction: column; gap: 0.1rem; }
    .meta strong { font-size: 1rem; font-weight: 600; }
    .meta span { font-size: 0.82rem; color: var(--muted); }
    .arrow { color: var(--muted); font-size: 1.1rem; }
    .soon {
      opacity: 0.55;
      pointer-events: none;
    }
    footer {
      margin-top: 2.5rem;
      text-align: center;
      color: rgba(167,176,201,0.7);
      font-size: 0.82rem;
    }
  </style>
</head>

        <p>时代在变，工具在变，但向内探索与向外突破的野心始终不变。感谢驻足，欢迎订阅同行。</p>

</html>
